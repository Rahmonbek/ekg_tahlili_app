    <rect width="280" height="170" fill="url(#grid2)"/>
    <path d="M10 85L38 85L45 80L52 85L65 85L73 85L83 55L91 115L99 85L128 85L143 80L153 85L168 85L185 85L195 55L203 115L211 85L270 85"
