<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="60 140 1280 660">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#efb0b0" stroke-width="0.7"/>
    </pattern>
    <pattern id="grid2" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid)"/>
      <path d="M50 0H0V50" fill="none" stroke="#df8f8f" stroke-width="1.1"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>
<!-- Card 1: tilted -->
  <g filter="url(#shadow)">
    <rect x="80" y="160" width="390" height="280" rx="20" fill="#f2eeee" stroke="#e53935" stroke-width="3"/>
  </g>
  <g transform="translate(145,205) rotate(-10 130 85)">
